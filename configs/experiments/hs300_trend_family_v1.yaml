name: hs300_trend_family_v1
group: hs300_factor_families_v1
market: ashare
provider: parquet
data_root: data/lake
reference_root: data/reference
universe: hs300
features:
  - close_to_sma_120
  - close_to_sma_10
  - close_to_sma_20
  - close_to_sma_5
  - close_to_sma_60
  - industry_momentum_63_21
  - industry_momentum_126_21
  - industry_momentum_252_21
  - momentum_63_21
  - momentum_126_21
  - momentum_252_21
  - price_to_26w_high
  - price_to_52w_high
  - return_1
  - return_10
  - return_120
  - return_20
  - return_3
  - return_5
  - return_60
  - short_term_reversal_20
  - short_term_reversal_5
feature_normalization: cross_sectional_zscore
ic_decay_horizons: [1, 5, 10, 20]
model: ridge
model_params:
  alpha: 1.0
train:
  start_date: 2021-01-01
  end_date: 2024-12-31
  validation_mode: walk_forward
  valid_start_date: 2024-01-01
  valid_end_date: 2024-12-31
  label_horizon: 5
  target_mode: cross_sectional_rank
  purge_size: 5
  embargo_size: 5
  walk_forward:
    train_size: 252
    valid_size: 63
    step_size: 63
    expanding: true
    purge_size: 5
    embargo_size: 5
signal_test:
  name: full_oos
  start_date: 2025-01-01
  end_date: 2026-04-24
signal_windows:
  - name: oos_2025_h1
    start_date: 2025-01-01
    end_date: 2025-06-30
  - name: oos_2025_h2
    start_date: 2025-07-01
    end_date: 2025-12-31
  - name: oos_2026_ytd
    start_date: 2026-01-01
    end_date: 2026-04-24
