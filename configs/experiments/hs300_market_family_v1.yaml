name: hs300_market_family_v1
group: hs300_factor_families_v1
market: ashare
provider: parquet
data_root: data/lake
reference_root: data/reference
universe: hs300
features:
  - beta_20_hs300
  - beta_120_hs300
  - beta_252_hs300
  - beta_60_hs300
  - downside_volatility_20
  - downside_volatility_60
  - ivol_120_hs300
  - ivol_20_hs300
  - ivol_60_hs300
feature_normalization: cross_sectional_zscore
ic_decay_horizons: [1, 5, 10, 20]
model: ridge
model_params:
  alpha: 1.0
train:
  start_date: 2021-01-01
  end_date: 2024-12-31
  validation_mode: walk_forward
  valid_start_date: 2024-01-01
  valid_end_date: 2024-12-31
  label_horizon: 5
  target_mode: cross_sectional_rank
  purge_size: 5
  embargo_size: 5
  walk_forward:
    train_size: 252
    valid_size: 63
    step_size: 63
    expanding: true
    purge_size: 5
    embargo_size: 5
signal_test:
  name: full_oos
  start_date: 2025-01-01
  end_date: 2026-04-24
signal_windows:
  - name: oos_2025_h1
    start_date: 2025-01-01
    end_date: 2025-06-30
  - name: oos_2025_h2
    start_date: 2025-07-01
    end_date: 2025-12-31
  - name: oos_2026_ytd
    start_date: 2026-01-01
    end_date: 2026-04-24
